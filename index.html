<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JasperPeng</title>
<meta name="description" content="Designer · Creator · Explorer —— 一个关于视觉设计、想象力、技术与人类创造力的个人档案馆。">
<meta name="author" content="JasperPeng">
<link rel="canonical" href="https://jasperpeng.uk/">
<meta property="og:url" content="https://jasperpeng.uk/">
<meta property="og:type" content="website">
<meta property="og:title" content="JasperPeng">
<meta property="og:description" content="Designer · Creator · Explorer">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="JasperPeng">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/favicon/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon/favicon.png">
<style>
  /* 扉页是全屏封面，不挂导航 —— 压一条栏会破坏「翻开一本书」的感觉。
     2026-10-14 按设计规范重做，和首页首屏同一个路子（用户：扉页也按这个风格）：
     · 像一本书的扉页：上面一行小字（标志 + Personal Archive），中间是书名，最下面一道细线隔开版权和一句话
     · 书名「JasperPeng」是特殊版面，可以超出字号表，铺满大半个版心；字体、字重仍按规范（无衬线 700、−1%）
     · 去掉了原来的三团彩色光晕和纸纹 —— 页面就是一张纸，层次靠字号和细线
     · 温度：书名「墨迹显影」显出来，然后茶芽色在名字下面签一笔（和首页「Create」下面那一笔同一套，style.css 第 10 节）
     · 其他元素「纸页落定」：从下面 24px 淡入，依次间隔 60ms */
  .cover {
    min-height: 100svh;
    width: min(100% - var(--page-margin) * 2, var(--page-width)); margin-inline: auto;
    display: grid; grid-template-rows: auto 1fr auto;
    padding-block: var(--space-6);
    transition: opacity var(--dur-sheet) var(--ease-ui), transform var(--dur-sheet) var(--ease-ui);
  }
  .cover.is-leaving { opacity: 0; transform: translateY(calc(var(--move-sm) * -1)); }
  .cover__top, .cover__foot {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
    color: var(--color-text-3); font-size: var(--text-label); font-weight: 500; letter-spacing: var(--tracking-label);
  }
  .cover__mark {
    display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-control-sm);
    background: var(--color-text); color: var(--color-bg); font-size: 15px; font-weight: 700; letter-spacing: 0;
  }
  .cover__inner { align-self: center; padding-block: var(--section-sm); }
  .cover__title {
    /* 书名铺满约 9 成版心：「JasperPeng」的字宽约是字号的 5.2 倍，按 5.6 倍算留出余量（Mac 和 Windows 的系统字体宽度不一样），最大 240 */
    font-size: min(calc((100vw - var(--page-margin) * 2) / 5.6), 15rem); line-height: 1; letter-spacing: var(--tracking-display); font-weight: 700;
    animation: inkIn var(--dur-enter) var(--ease-paper) both;
  }
  .cover__title .hero__line { bottom: -.2em; height: .12em; }   /* 签在字母下伸部分（J、p、g）的下面，不穿过它们 */
  .cover__title .hero__line { animation-delay: 500ms; }
  .cover__title .hero__line path { stroke-width: .045em; }
  .cover__row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-5);
    margin-top: var(--space-8);
  }
  .cover__sub { color: var(--color-text-2); font-family: var(--font-serif); font-size: var(--text-lead); line-height: var(--leading-relaxed); }
  .cover__foot { padding-top: var(--space-4); border-top: 1px solid var(--color-line); }
  .cover__top { animation: cin var(--dur-enter) var(--ease-paper) both; }
  .cover__row > * { animation: cin var(--dur-enter) var(--ease-paper) both; animation-delay: calc(240ms + var(--i, 0) * var(--stagger)); }
  .cover__foot { animation: cin var(--dur-enter) var(--ease-paper) 360ms both; }
  @keyframes cin { from { opacity: 0; transform: translateY(var(--move-md)) } to { opacity: 1; transform: none } }
  @media (max-width: 640px) {
    .cover__row { flex-direction: column; align-items: flex-start; margin-top: var(--space-6); }
    .cover__row .btn { width: 100%; }
  }
</style>
</head>
<body data-base="" data-page="cover">

<main class="cover" id="cover">
  <header class="cover__top">
    <span class="cover__mark" aria-hidden="true">J</span>
    <span>Personal Archive</span>
  </header>

  <div class="cover__inner">
    <h1 class="cover__title"><em class="hero__mark">JasperPeng<svg class="hero__line" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true"><path d="M3 12 C 60 7, 130 6, 190 9 S 270 13, 297 7" pathLength="1"/></svg></em></h1>
    <div class="cover__row">
      <p class="cover__sub" style="--i:0">Designer · Creator · Explorer</p>
      <a class="btn btn--primary btn--lg" style="--i:1" href="home.html" data-enter>Explore<i class="arr" aria-hidden="true"></i></a>
    </div>
  </div>

  <footer class="cover__foot">
    <span>JasperPeng©2026</span>
    <span>Design. Think. Create.</span>
  </footer>
</main>

<script>
  /* 扉页很轻，不加载整套 main.js */
  (function () {
    var link = document.querySelector('[data-enter]'), cover = document.getElementById('cover');
    if (!link || !cover) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if ('startViewTransition' in document) return;   /* 交给 CSS，避免叠两套动画 */
    link.addEventListener('click', function (e) {
      e.preventDefault();
      cover.classList.add('is-leaving');
      setTimeout(function () { location.href = link.getAttribute('href'); }, 300);   /* = --dur-sheet */
    });
  })();
</script>
</body>
</html>
